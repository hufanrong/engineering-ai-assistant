name: Build APK & Windows Installer

# 触发条件：
#  - 每次 push 到 main 自动构建
#  - 也可在 Actions 页面手动触发（Run workflow → 填写 tag）
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_tag:
        description: '版本标签（如 3.3.0），用于 Release 命名'
        required: false
        default: '3.3.0'

jobs:
  ############################################
  # Job 1：构建 Android APK
  ############################################
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21（Capacitor 8.5 需要）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packaging/fangong-android/package-lock.json

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Capacitor 依赖
        working-directory: packaging/fangong-android
        run: npm ci

      - name: 复制 Web 资源到 Android 工程
        working-directory: packaging/fangong-android
        run: |
          rm -rf android/app/src/main/assets/public
          npx cap copy android

      - name: 构建 Debug APK
        working-directory: packaging/fangong-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: fangong-ai-apk
          path: packaging/fangong-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ############################################
  # Job 2：构建 Windows 安装版（NSIS exe）
  # 用 Windows runner，直接产出带安装向导的 Setup exe
  ############################################
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packaging/fangong-desktop/package-lock.json

      - name: 安装 Electron 依赖
        working-directory: packaging/fangong-desktop
        run: npm ci

      - name: 构建 Windows 安装包（NSIS）
        working-directory: packaging/fangong-desktop
        run: npx electron-builder --win nsis

      - name: 上传 Windows 安装包
        uses: actions/upload-artifact@v4
        with:
          name: fangong-ai-windows-setup
          path: packaging/fangong-desktop/dist/*.exe
          if-no-files-found: error

  ############################################
  # Job 3：打包所有产物到 GitHub Release（可选，手动触发时生成）
  ############################################
  release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 下载 APK
        uses: actions/download-artifact@v4
        with:
          name: fangong-ai-apk
          path: release/

      - name: 下载 Windows 安装包
        uses: actions/download-artifact@v4
        with:
          name: fangong-ai-windows-setup
          path: release/

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version_tag }}
          name: 繁工AI v${{ github.event.inputs.version_tag }}
          body: |
            ## 繁工AI v${{ github.event.inputs.version_tag }}
            - 手机端 APK（Android）
            - 电脑端 Windows 安装包（Setup exe）
          files: release/**
          draft: false
          prerelease: false
