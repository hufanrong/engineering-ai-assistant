<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>繁工AI 本地解析工作台</title>
<style>
  :root{
    --blue:#1E5AA8; --blue-d:#153f75; --orange:#FF7A00;
    --bg:#F4F5F7; --card:#fff; --line:#E4E6EB; --text:#1A1B1C; --sub:#6B7280;
    --ok:#1B8A3F; --warn:#B45309; --err:#C0392B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Roboto','PingFang SC','Microsoft YaHei',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
  .wrap{max-width:980px;margin:0 auto;padding:12px}
  header{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:12px}
  .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
  .brand h1{font-size:17px;font-weight:700}
  .brand p{font-size:12px;color:var(--sub)}
  .status-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--sub)}
  .chip b{color:var(--blue)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .tab{padding:7px 14px;border-radius:8px;background:var(--card);border:1px solid var(--line);cursor:pointer;font-size:13px;color:var(--sub)}
  .tab.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
  .panel{display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .panel.on{display:block}
  h2{font-size:15px;margin-bottom:10px;color:var(--blue)}
  label{font-size:13px;color:var(--sub);display:block;margin:8px 0 4px}
  input[type=text],input[type=number],select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px}
  .btn{display:inline-block;padding:9px 18px;border:none;border-radius:8px;font-size:14px;cursor:pointer;background:var(--blue);color:#fff;font-weight:600}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.orange{background:var(--orange)}
  .btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--sub)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .prog{height:10px;background:#E9EAEE;border-radius:6px;overflow:hidden;margin:10px 0}
  .prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),#4A90D9);transition:width .3s}
  .msg{font-size:13px;color:var(--sub);margin-top:6px;word-break:break-all}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
  th{color:var(--sub);font-weight:600;white-space:nowrap}
  .st{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px}
  .st.parsed{background:#E5F5EA;color:var(--ok)}
  .st.partial{background:#FDF3E3;color:var(--warn)}
  .st.failed{background:#FBE9E7;color:var(--err)}
  .st.skipped{background:#EEF0F3;color:var(--sub)}
  .item{cursor:pointer}
  .item:hover{background:#F7F9FC}
  .detail{border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:10px;background:#FAFBFC;font-size:13px;max-height:340px;overflow:auto}
  .detail pre{white-space:pre-wrap;word-break:break-all;font-family:inherit}
  .search-item{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;font-size:13px}
  .search-item .meta{color:var(--sub);font-size:12px;margin-bottom:4px}
  .empty{color:var(--sub);text-align:center;padding:24px 0;font-size:13px}
  .qr{color:var(--sub);font-size:12px;margin-top:8px}
  @media(max-width:480px){ .wrap{padding:8px} .tab{padding:6px 10px;font-size:12px} th,td{font-size:12px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">繁</div>
    <div class="brand">
      <h1>繁工AI · 本地解析工作台</h1>
      <p id="nodeName">解析节点：—</p>
    </div>
  </header>

  <div class="status-bar" id="statusBar">
    <span class="chip">向量库 <b id="stVec">—</b></span>
    <span class="chip">已登记文件 <b id="stIdx">—</b></span>
    <span class="chip">待上传 <b id="stQueue">—</b></span>
    <span class="chip">云端 <b id="stCloud">—</b></span>
  </div>

  <div class="tabs">
    <div class="tab on" data-p="scan">① 扫描解析</div>
    <div class="tab" data-p="results">② 结果库</div>
    <div class="tab" data-p="search">③ AI 检索</div>
    <div class="tab" data-p="queue">④ 上传队列</div>
  </div>

  <!-- ① 扫描 -->
  <div class="panel on" id="p-scan">
    <h2>扫描文件夹 → 深度解析 → 向量化 → 待上传</h2>
    <label>文件夹路径（支持多个：每行一个路径；可输入 D:\资料 形式，自动递归处理全部支持的文件）</label>
    <textarea id="folder" rows="3" style="width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;box-sizing:border-box;resize:vertical" placeholder="例如：&#10;D:\工程资料\XX项目\施工图纸&#10;D:\工程资料\XX项目\设备台账"></textarea>
    <div class="row" style="margin-top:8px">
      <button class="btn" id="btnScan">扫描解析</button>
      <button class="btn ghost" id="btnForce">强制重扫</button>
      <button class="btn ghost" id="btnRetry">重试失败文件</button>
      <button class="btn orange" id="btnCancel" style="display:none">停止</button>
    </div>
    <div class="prog"><i id="progBar"></i></div>
    <div class="msg" id="scanMsg">等待扫描…</div>
    <div class="qr" id="scanStats"></div>
    <div style="border-top:1px solid var(--line);margin-top:16px;padding-top:12px">
      <h2>手动上传文件（手机端/浏览器直传）</h2>
      <label>上传人姓名（现场记录必填，方便溯源）</label>
      <div class="row">
        <input type="text" id="uploader" style="max-width:220px" placeholder="例如：胡繁荣">
        <input type="file" id="upfiles" multiple style="flex:1;min-width:200px;font-size:13px">
        <button class="btn orange" id="btnUploadFiles">上传并解析</button>
      </div>
      <div class="msg" id="uploadFilesMsg"></div>
    </div>
  </div>

  <!-- ② 结果库 -->
  <div class="panel" id="p-results">
    <h2>已解析文件清单（点击查看结构化详情）</h2>
    <div class="row" style="margin-bottom:8px">
      <select id="filter" style="max-width:200px">
        <option value="">全部状态</option>
        <option value="parsed">parsed 已解析</option>
        <option value="partial">partial 部分</option>
        <option value="failed">failed 失败</option>
        <option value="skipped">skipped 跳过</option>
      </select>
      <button class="btn ghost" id="btnRefresh">刷新</button>
    </div>
    <div id="resultList"></div>
    <div class="detail" id="resultDetail" style="display:none"></div>
  </div>

  <!-- ③ AI 检索 -->
  <div class="panel" id="p-search">
    <h2>向量检索（验证解析库已可被 AI/Agent 读取）</h2>
    <label>输入查询，例如"1号车间离心泵 P-101 安装位置"</label>
    <div class="row">
      <input type="text" id="query" placeholder="输入检索内容…">
      <button class="btn" id="btnSearch">检索</button>
    </div>
    <div id="searchOut" style="margin-top:10px"></div>
  </div>

  <!-- ④ 上传队列 -->
  <div class="panel" id="p-queue">
    <h2>云端合并上传队列</h2>
    <div class="msg" style="margin-bottom:8px">解析完成的文件已打包在此队列。配置好 app/config.py 的 CLOUD_ENDPOINT 后，点"上传到云端"完成合并（SHA256 自动去重）。未配置时文件安全保留在本机。</div>
    <button class="btn" id="btnUpload">上传到云端</button>
    <button class="btn ghost" id="btnQueueRefresh">刷新队列</button>
    <div class="msg" id="uploadMsg" style="margin-top:8px"></div>
    <div id="queueList" style="margin-top:8px"></div>
  </div>
</div>

<script src="/web/app.js"></script>
</body>
</html>
